<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <title>Bluesky Chatterboxes</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400&display=swap"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <main>
            <h1>Bluesky Chatterboxes</h1>
            <dialog class="heading-divider"></dialog>
            <p class="subtitle">
                Enter your Bluesky handle to see how often the accounts you
                follow post.
                <span class="hint"
                    >No login required. Uses the public Bluesky API. Doesn't
                    save any of your personal data. Large follow lists may take
                    a bit to load.</span
                >
            </p>

            <form id="form">
                <label for="handle">Handle</label>
                <div class="row">
                    <input
                        id="handle"
                        type="text"
                        placeholder="e.g. jeremykanter.bsky.social"
                        autocomplete="off"
                        spellcheck="false"
                        required
                    />
                    <button type="submit" id="go">Analyze</button>
                </div>
            </form>

            <section id="status" class="status" hidden></section>

            <section id="results" hidden>
                <div class="sort-control">
                    <label for="sort-select">Sort by</label>
                    <select id="sort-select">
                        <option value="total">Total Posts</option>
                        <option value="originals">Originals</option>
                        <option value="reposts">Reposts</option>
                    </select>
                </div>
                <table>
                    <thead id="head">
                        <tr>
                            <th></th>
                            <th class="num sortable" data-sort-key="total">
                                Total Posts
                            </th>
                            <th class="num sortable" data-sort-key="originals">
                                Originals
                            </th>
                            <th class="num sortable" data-sort-key="reposts">
                                Reposts
                            </th>
                        </tr>
                    </thead>
                    <tbody id="rows"></tbody>
                </table>
            </section>
        </main>
        <script src="app.js"></script>
    </body>
</html>
